<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Exam Performance Predictor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-800: #1f2937;
      }
      * {
        font-family: "Inter", sans-serif;
      }
      body {
        background: linear-gradient(135deg, var(--gray-50) 0%, #e5e7eb 100%);
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .header {
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: 40px;
        text-align: center;
        max-width: 800px;
      }
      .btn-predict {
        background: var(--primary);
        border: none;
        border-radius: 12px;
        padding: 14px 32px;
        font-size: 18px;
        font-weight: 600;
        color: white;
        transition: background-color 0.2s ease;
        text-decoration: none;
      }
      .btn-predict:hover {
        background: var(--primary-dark);
        color: white;
      }
      footer {
        text-align: center;
        margin-top: 60px;
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="row align-items-center">
        <div class="col-12 text-center mb-3">
          <i class="fas fa-graduation-cap fa-3x text-primary"></i>
        </div>
        <div class="col-12 text-center">
          <h1 class="h2 fw-bold mb-2" style="color: var(--gray-800)">
            Welcome to the Student Performance Predictor
          </h1>
          <p class="mb-4" style="color: #6b7280; font-size: 18px">
            Use our AI-powered tool to predict student math scores based on
            various factors.
          </p>
          <a href="/predictdata" class="btn btn-predict">
            <i class="fas fa-arrow-right me-2"></i>
            Get Started
          </a>
        </div>
      </div>
    </div>

    <footer>
      <p>Built with Flask & Machine Learning | For educational purposes</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
